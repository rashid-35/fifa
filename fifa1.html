<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2-Player Mini FIFA Game</title>
<style>
  body {
    background: #1b5e20;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    flex-direction: column;
  }

  #game-container {
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border-radius: 8px;
    overflow: hidden;
  }

  .scoreboard {
    width: 100%;
    background: #111;
    color: #fff;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 12px 0;
    font-size: 20px;
    font-weight: bold;
    border-bottom: 2px solid #fff;
  }

  .p1-score { color: #2196f3; }
  .p2-score { color: #f44336; }
  .timer-box { color: #ffeb3b; }

  canvas {
    background: #0b6623;
    border: 5px solid white;
    border-top: none;
    display: block;
  }

  .game-over-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    border-radius: 8px;
  }

  .btn {
    margin-top: 20px;
    padding: 12px 30px;
    font-size: 18px;
    background-color: #ffeb3b;
    color: #111;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s;
  }

  .btn:hover {
    transform: scale(1.05);
    background-color: #ffee58;
  }

  .controls-hint {
    margin-top: 12px;
    color: white;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="game-container">
  <div class="scoreboard">
    <div class="p1-score">P1 (WASD): <span id="p1-goals">0</span></div>
    <div class="timer-box">TIME: <span id="timer">90</span>s</div>
    <div class="p2-score">P2 (ARROWS): <span id="p2-goals">0</span></div>
  </div>

  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <div id="game-over" class="game-over-screen" style="display: none;">
    <h1 id="winnerText">FULL TIME! ⚽</h1>
    <p>Final Score: <span id="final-score">0 - 0</span></p>
    <button class="btn" onclick="resetGame()">Play Again</button>
  </div>
</div>

<div class="controls-hint">
  <strong>P1 (Blue):</strong> W A S D | <strong>P2 (Red):</strong> Arrow Keys
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const p1GoalsEl = document.getElementById("p1-goals");
const p2GoalsEl = document.getElementById("p2-goals");
const timerEl = document.getElementById("timer");
const gameOverScreen = document.getElementById("game-over");
const winnerTextEl = document.getElementById("winnerText");
const finalScoreEl = document.getElementById("final-score");

let p1Goals = 0;
let p2Goals = 0;
let timeLeft = 90;
let gameActive = true;
let timerInterval;

const p1 = { x: 150, y: 200, size: 20, color: "#2196f3", speed: 5 };
const p2 = { x: 650, y: 200, size: 20, color: "#f44336", speed: 5 };
const ball = { x: 400, y: 200, size: 12, color: "white", dx: 0, dy: 0 };

// Goals at both ends
const goalLeft = { x: 0, y: 150, w: 25, h: 100 };
const goalRight = { x: 775, y: 150, w: 25, h: 100 };

let keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!gameActive) return;
    
    timeLeft--;
    timerEl.textContent = timeLeft;

    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

function movePlayers() {
  // Player 1 (WASD)
  if ((keys["w"] || keys["W"]) && p1.y - p1.size > 0) p1.y -= p1.speed;
  if ((keys["s"] || keys["S"]) && p1.y + p1.size < canvas.height) p1.y += p1.speed;
  if ((keys["a"] || keys["A"]) && p1.x - p1.size > 0) p1.x -= p1.speed;
  if ((keys["d"] || keys["D"]) && p1.x + p1.size < canvas.width) p1.x += p1.speed;

  // Player 2 (Arrow Keys)
  if (keys["ArrowUp"] && p2.y - p2.size > 0) p2.y -= p2.speed;
  if (keys["ArrowDown"] && p2.y + p2.size < canvas.height) p2.y += p2.speed;
  if (keys["ArrowLeft"] && p2.x - p2.size > 0) p2.x -= p2.speed;
  if (keys["ArrowRight"] && p2.x + p2.size < canvas.width) p2.x += p2.speed;
}

function moveBall() {
  ball.x += ball.dx;
  ball.y += ball.dy;

  ball.dx *= 0.98; // friction
  ball.dy *= 0.98;

  // Bounce off top and bottom boundaries
  if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
    ball.dy *= -1;
  }

  // Bounce off left wall (except inside left goal)
  if (ball.x - ball.size < 0) {
    if (ball.y < goalLeft.y || ball.y > goalLeft.y + goalLeft.h) {
      ball.dx *= -1;
    }
  }

  // Bounce off right wall (except inside right goal)
  if (ball.x + ball.size > canvas.width) {
    if (ball.y < goalRight.y || ball.y > goalRight.y + goalRight.h) {
      ball.dx *= -1;
    }
  }
}

function handleKick(player) {
  const dx = ball.x - player.x;
  const dy = ball.y - player.y;
  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance < player.size + ball.size) {
    ball.dx = dx * 0.35;
    ball.dy = dy * 0.35;
  }
}

function checkGoals() {
  // Goal in Left Goal (P2 Scores!)
  if (ball.x - ball.size < goalLeft.x + goalLeft.w && ball.y > goalLeft.y && ball.y < goalLeft.y + goalLeft.h) {
    p2Goals++;
    p2GoalsEl.textContent = p2Goals;
    resetPositions();
  }

  // Goal in Right Goal (P1 Scores!)
  if (ball.x + ball.size > goalRight.x && ball.y > goalRight.y && ball.y < goalRight.y + goalRight.h) {
    p1Goals++;
    p1GoalsEl.textContent = p1Goals;
    resetPositions();
  }
}

function getRandomBallPosition() {
  const minX = 150;
  const maxX = canvas.width - 150;
  const minY = 50;
  const maxY = canvas.height - 50;

  return {
    x: Math.floor(Math.random() * (maxX - minX + 1)) + minX,
    y: Math.floor(Math.random() * (maxY - minY + 1)) + minY
  };
}

function resetPositions() {
  p1.x = 150;
  p1.y = 200;
  p2.x = 650;
  p2.y = 200;

  const newPos = getRandomBallPosition();
  ball.x = newPos.x;
  ball.y = newPos.y;
  ball.dx = 0;
  ball.dy = 0;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Field line markings
  ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
  ctx.lineWidth = 2;

  // Center Line & Circle
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
  ctx.stroke();

  // Draw Left Goal (Red Team Goal)
  ctx.fillStyle = "rgba(244, 67, 54, 0.2)";
  ctx.fillRect(goalLeft.x, goalLeft.y, goalLeft.w, goalLeft.h);
  ctx.strokeStyle = "#f44336";
  ctx.lineWidth = 3;
  ctx.strokeRect(goalLeft.x, goalLeft.y, goalLeft.w, goalLeft.h);

  // Draw Right Goal (Blue Team Goal)
  ctx.fillStyle = "rgba(33, 150, 243, 0.2)";
  ctx.fillRect(goalRight.x, goalRight.y, goalRight.w, goalRight.h);
  ctx.strokeStyle = "#2196f3";
  ctx.lineWidth = 3;
  ctx.strokeRect(goalRight.x, goalRight.y, goalRight.w, goalRight.h);

  // Draw P1
  ctx.fillStyle = p1.color;
  ctx.beginPath();
  ctx.arc(p1.x, p1.y, p1.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw P2
  ctx.fillStyle = p2.color;
  ctx.beginPath();
  ctx.arc(p2.x, p2.y, p2.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw Ball
  ctx.fillStyle = ball.color;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "black";
  ctx.lineWidth = 1;
  ctx.stroke();
}

function gameLoop() {
  if (gameActive) {
    movePlayers();
    moveBall();
    handleKick(p1);
    handleKick(p2);
    checkGoals();
    draw();
  }
  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameActive = false;
  clearInterval(timerInterval);
  
  if (p1Goals > p2Goals) {
    winnerTextEl.textContent = "PLAYER 1 WINS! 🏆";
  } else if (p2Goals > p1Goals) {
    winnerTextEl.textContent = "PLAYER 2 WINS! 🏆";
  } else {
    winnerTextEl.textContent = "IT'S A DRAW! ⚽";
  }

  finalScoreEl.textContent = `${p1Goals} - ${p2Goals}`;
  gameOverScreen.style.display = "flex";
}

function resetGame() {
  p1Goals = 0;
  p2Goals = 0;
  timeLeft = 90;
  p1GoalsEl.textContent = p1Goals;
  p2GoalsEl.textContent = p2Goals;
  timerEl.textContent = timeLeft;
  gameOverScreen.style.display = "none";
  resetPositions();
  gameActive = true;
  startTimer();
}

// Initial positioning and loop start
resetPositions();
startTimer();
gameLoop();
</script>
</body>
</html>
